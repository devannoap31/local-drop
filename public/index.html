<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Local Drop</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="localDropApp()">

    <div id="loginOverlay" x-show="!isLoggedIn" x-cloak>
        <div id="loginBox">
            <h2>🔒 Local Drop</h2>
            <p>Masukkan Password untuk masuk</p>
            <input type="password" x-model="pin" placeholder="Masukkan Password" @keyup.enter="verifyPin()">
            <button class="btn-primary login-btn-block" @click="verifyPin()">Masuk</button>
            <p x-show="loginError" class="error-text">Password Salah!</p>
        </div>
    </div>

    <div id="appContent" x-show="isLoggedIn" x-cloak class="mt-20">
        <h2>
            <span>⚡ Local Drop</span>
            <span>
                <button @click="toggleTheme()" class="header-btn-theme" x-text="theme === 'dark' ? '☀️' : '🌙'"></button>
                <button @click="logout()" class="btn-danger header-btn-logout">Keluar</button>
            </span>
        </h2>

        <div class="card" style="padding: 10px;" x-data="{ activeTab: 'teks' }">
            <div class="tab-container">
                <button class="tab-button" @click="activeTab = 'teks'" :class="{ 'tab-active': activeTab === 'teks' }">TEKS</button>
                <button class="tab-button" @click="activeTab = 'txt'" :class="{ 'tab-active': activeTab === 'txt' }">BUAT .TXT</button>
                <button class="tab-button" @click="activeTab = 'files'" :class="{ 'tab-active': activeTab === 'files' }">FILES</button>
            </div>

            <div x-show="activeTab === 'teks'" x-transition>
                <h3>Kirim Teks / Link</h3>
                <textarea class="large-textarea" placeholder="Ketik atau paste teks, link, atau catatan di sini..." x-model="sharedText"></textarea>
                <div class="btn-group mt-10">
                    <button class="btn-primary" @click="updateText()" x-text="btnKirimText"></button>
                    <button class="btn-secondary" @click="copyText()" x-text="btnCopyText"></button>
                    <button class="btn-success" @click="fetchText()" x-text="btnMuatText"></button>
                </div>
            </div>

            <div x-show="activeTab === 'txt'" x-transition x-cloak>
                <h3>Buat File .txt Fisik</h3>
                <input type="text" placeholder="Nama file (contoh: catatan.txt)" x-model="txtFilename">
                <textarea class="large-textarea" placeholder="Isi catatan file .txt..." x-model="txtContent"></textarea>
                <button class="btn-primary mt-10" @click="createTextFile()" x-text="btnBuatTxt" :disabled="isCreatingTxt" style="width: 100%;"></button>
            </div>

            <div x-show="activeTab === 'files'" x-transition x-cloak>
                <h3>Kirim File / Gambar</h3>
                <input type="file" x-ref="fileInput" multiple> 
                <button class="btn-primary mt-10" @click="uploadFile()" x-text="btnUploadText" :disabled="isUploading" style="width: 100%;"></button>
                
                <div id="progressContainer" x-show="isUploading">
                    <div id="progressBar" :style="`width: ${progressPercent}%`"></div>
                </div>
                <div id="progressText" x-show="isUploading" x-text="progressText"></div>
            </div> <div id="latestFile" x-show="sharedFiles.length > 0" style="display: block; margin-top: 30px;">
                🎉 <b x-text="`${sharedFiles.length} File Tersedia!`"></b><br><br>
                <template x-for="file in sharedFiles" :key="file.url">
                    <a :href="file.url" :download="file.name" x-text="`📥 Download: ${file.name}`"></a>
                </template>
            </div> 
            <button class="btn-danger mt-10" x-show="sharedFiles.length > 0" @click="clearFiles()" style="width: 100%;">Bersihkan Link</button>
            </div> </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
